{% extends 'users/base.html' %}
{% load crispy_forms_tags %}
{% block title %}Register{% endblock %}

{% block body %}
  <div class="row">
    <h1>Register</h1>
  </div>

  <div class="row mt-4">
    <div class="col-md-6">
      <form method="POST">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary">Register</button>
      </form>
    </div>
  </div>

  <p class="mt-4">
    Already have an account?
    <a href="{% url 'login' %}">Log in</a>
  </p>
{% endblock %}
