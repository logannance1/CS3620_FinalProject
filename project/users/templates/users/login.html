{% extends 'users/base.html' %}
{% load crispy_forms_tags %}
{% block title %}Login{% endblock %}
{% block body %}
  <div class="row">
    <h1>Log in</h1>
  </div>

  <div class="row mt-4">
    <div class="col-md-6">
      <form method="POST">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary">Log in</button>
      </form>
    </div>
  </div>

  <p class="mt-4">
    Don't have an account?
    <a href="{% url 'register' %}">Register</a>
  </p>
{% endblock %}
